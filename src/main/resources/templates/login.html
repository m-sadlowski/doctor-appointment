<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Klinika JAVA - Logowanie</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 520px; margin: 60px auto; }
        h1 { margin-bottom: 8px; }
        .hint { color: #555; margin-bottom: 20px; }
        form { display: flex; gap: 12px; align-items: flex-end; }
        input { padding: 10px; font-size: 16px; width: 220px; }
        button { padding: 10px 16px; font-size: 16px; cursor: pointer; }
        .error { color: #b00020; margin-top: 14px; }
        .links { margin-top: 18px; }
    </style>
</head>
<body>

<h1>Logowanie (admin)</h1>
<p class="hint">Na razie proste haslo</p>

<form method="post" action="/login">
    <div>
        <label for="password">Hasło:</label><br/>
        <input id="password" name="password" type="password" placeholder="Wpisz hasło" required />
    </div>
    <button type="submit">Zaloguj</button>
</form>

<p class="error" th:if="${error}" th:text="${error}"></p>

<div class="links">
    <a th:href="@{/}">← Powrót na stronę główną</a>
</div>

</body>
</html>
