<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Moje wizyty</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1100px; margin: 40px auto; }
        table { border-collapse: collapse; width: 100%; margin-top: 16px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f6f6f6; }
        .msg-ok { color:#2e7d32; font-weight:600; }
        .msg-err { color:#b00020; font-weight:600; }
        .row-actions form { display:inline; }
        input { padding: 10px; width: 220px; }
        button { padding: 10px 14px; cursor:pointer; }
        a.btn { display:inline-block; padding:8px 12px; border:1px solid #ccc; border-radius:10px; text-decoration:none; }
    </style>
</head>
<body>

<header style="display:flex; justify-content:space-between; align-items:center;">
    <h1>Moje wizyty</h1>
    <div>
        <a href="/" class="btn">Strona główna</a>
        <a href="/appointments" class="btn">Zapisz się</a>
    </div>
</header>

<p th:if="${error}" th:text="${error}" class="msg-err"></p>
<p th:if="${success}" th:text="${success}" class="msg-ok"></p>

<form method="post" action="/my-appointments" style="margin-top:16px; display:flex; gap:12px; align-items:end;">
    <div>
        <label>Numer telefonu użyty przy rezerwacji</label><br/>
        <input name="phoneNumber" required placeholder="np. 123456789"
               th:value="${phoneNumber != null ? phoneNumber : ''}">
    </div>
    <button type="submit">Pokaż moje wizyty</button>
</form>

<table th:if="${appointments != null}">
    <thead>
    <tr>
        <th>Data i godzina</th>
        <th>Lekarz</th>
        <th>Specjalizacja</th>
        <th>Pacjent</th>
        <th>Akcja</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="a : ${appointments}">
        <td th:text="${#temporals.format(a.dateTime, 'dd MMMM yyyy, HH:mm')}"></td>
        <td th:text="${a.doctor.fullName}"></td>
        <td th:text="${a.doctor.specialization}"></td>
        <td th:text="${a.patient.fullName}"></td>
        <td class="row-actions">
            <form th:action="@{'/my-appointments/' + ${a.id} + '/cancel'}" method="post">
                <input type="hidden" name="phoneNumber" th:value="${phoneNumber}">
                <button type="submit">Odwolaj</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(appointments)}">
        <td colspan="5">Nie znaleziono rezerwacji dla tego numeru.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
