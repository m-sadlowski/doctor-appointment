# A unique database per application context; never connect to ./data/clinicdb.
spring.datasource.url=jdbc:h2:mem:clinic-test-${random.uuid};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.jpa.open-in-view=false

# Test-only value: no APP_ADMIN_PASSWORD environment variable is required.
app.admin-password=test-only-admin-password
